version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: kinemov
      POSTGRES_USER: kinemov
      POSTGRES_PASSWORD: secret123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinemov -d kinemov"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: